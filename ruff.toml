# An explicit rule set, so local, sandbox and CI runs agree whatever ruff version is installed:
# ruff's default selection changes between releases.
extend-exclude = [".github", "ingestion/sources"]

[lint]
select = ["E4", "E7", "E9", "F"]

# A Fabric notebook item imports in the cell that needs it, after the parameters, mount and
# install cells the plugin template puts first.
[lint.per-file-ignores]
"**/*.Notebook/notebook-content.py" = ["E402"]
