# The Domain's own profile, for a run outside Studio. `prod` names the production catalog and
# Primary Schema; the host, warehouse and token come from the environment, so nothing here points
# at one workspace or carries a credential. A Studio Intent runs with its own dbt_databricks
# profile, written outside the repository (DBT_PROFILE_NAME, DBT_PROFILES_DIR); the bundle job's
# dbt task with the profile Databricks generates from the job's warehouse, catalog and schema.
dbt_databricks:
  target: prod
  outputs:
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: <VD_DOMAIN_DATABRICKS_CATALOG>
      schema: <VD_DOMAIN_DATABRICKS_PRIMARY_SCHEMA>
      threads: 4
