# Connections are [sources.<name>] sections, one per source, added by the intent that adds it.
# No secrets here: dlt reads them from the bound secret store.

# Bronze keeps source column names verbatim.
[schema]
naming = "direct"

# Parquet and Arrow carry no load metadata of their own: stamp every row so each is traceable to its load.
[normalize.parquet_normalizer]
add_dlt_load_id = true
add_dlt_id = true
