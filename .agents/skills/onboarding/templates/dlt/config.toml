# Connections are [sources.<name>] sections, one per source, added by the intent that adds it.
# No secrets here: dlt reads them from the Domain's secret scope.
# dlt refuses a [destination.databricks.credentials] section here (credentials are secret
# values): the catalog and SQL warehouse come from the pipeline notebook's dlt_env widget.

# Bronze keeps the source's column names; Databricks folds them to lower case.
[schema]
naming = "direct"

# Parquet and Arrow carry no load metadata of their own: stamp every row so each is traceable to its load.
[normalize.parquet_normalizer]
add_dlt_load_id = true
add_dlt_id = true

[destination.databricks]
keep_staged_files = false
