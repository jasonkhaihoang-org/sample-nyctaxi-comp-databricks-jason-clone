# Connections are [sources.<name>] sections. No secrets here: dlt reads them from the bound secret store.

# Bronze keeps source column names verbatim (VendorID stays VendorID).
[schema]
naming = "direct"

# Parquet files carry no load metadata of their own: stamp every row so each is traceable to its load.
[normalize.parquet_normalizer]
add_dlt_load_id = true
add_dlt_id = true

[sources.tlc]
connector = "custom"
connector_source = "local"
entry_point = "tlc_source"

[sources.mdm]
connector = "custom"
connector_source = "local"
entry_point = "mdm_source"

[sources.ops]
connector = "custom"
connector_source = "local"
entry_point = "ops_source"
