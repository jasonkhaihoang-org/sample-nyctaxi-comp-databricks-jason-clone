# Connections are [sources.<name>] sections. No source reads a secret, so no
# [providers.databricks_secret_scope] scope is named.

# Bronze keeps the source's column names; Databricks folds them to lower case (VendorID lands as vendorid).
[schema]
naming = "direct"

# Parquet files carry no load metadata of their own: stamp every row so each is traceable to its load.
[normalize.parquet_normalizer]
add_dlt_load_id = true
add_dlt_id = true

[sources.tlc]
connector = "custom"
connector_source = "local"
entry_point = "tlc_source"

[sources.mdm]
connector = "custom"
connector_source = "local"
entry_point = "mdm_source"

[sources.ops]
connector = "custom"
connector_source = "local"
entry_point = "ops_source"

# dlt refuses a [destination.databricks.credentials] section here: credentials are secret
# values, which config.toml cannot hold. The catalog and SQL warehouse come from the
# notebook's dlt_env widget instead. A sandbox run passes the Ephemeral ones; the job passes
# its dlt_env variable, which defaults to the catalog and warehouse it is deployed with.
# Databricks compute supplies the host and token.
[destination.databricks]
keep_staged_files = false
