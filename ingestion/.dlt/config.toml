# Connections are [sources.<name>] sections. No secrets here: dlt reads them from the bound secret store.

# Bronze keeps source column names verbatim (VendorID stays VendorID).
[schema]
naming = "direct"

# Parquet files carry no load metadata of their own: stamp every row so each is traceable to its load.
[normalize.parquet_normalizer]
add_dlt_load_id = true
add_dlt_id = true

[sources.tlc]
connector = "custom"
connector_source = "local"
entry_point = "tlc_source"

[sources.mdm]
connector = "custom"
connector_source = "local"
entry_point = "mdm_source"

[sources.ops]
connector = "custom"
connector_source = "local"
entry_point = "ops_source"

# The Domain's secret store. No source here reads a secret, but the Fabric notebook unit
# always registers the vault as dlt's secret provider (fabric_lakehouse/dlt.md).
[providers.azure_key_vault]
vault_url = "https://ukvdtestkv1.vault.azure.net/"

# The Domain Lakehouse (fabric_lakehouse/dlt.md, Destination). Studio retargets an Intent
# run to its Ephemeral Lakehouse through dlt's DESTINATION__FILESYSTEM__* environment override.
# OneLake's account name and host are credentials, so the Secret Store holds them:
# destination--filesystem--credentials--azure-storage-account-name = onelake and
# destination--filesystem--credentials--azure-account-host = onelake.blob.fabric.microsoft.com.
[destination.filesystem]
workspace_id = "b9e3c113-ca4b-4b05-9c98-6b71c3e5805f"
lakehouse_id = "2e80c60f-fa7e-4215-81a2-b66ceba7da3a"
bucket_url = "abfss://b9e3c113-ca4b-4b05-9c98-6b71c3e5805f@onelake.dfs.fabric.microsoft.com/2e80c60f-fa7e-4215-81a2-b66ceba7da3a/Tables"
