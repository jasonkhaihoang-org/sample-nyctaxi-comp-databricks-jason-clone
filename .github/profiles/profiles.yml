# dbt profile for the Databricks production-manifest publish.
#
#   dbt_databricks_compile — offline, renders catalog: <PROD_DB_NAME>, schema: <PROD_SCHEMA_NAME> (else default)
#
# Both come from the Domain's own ci-config.yml; every caller sets PROD_DB_NAME first,
# and PROD_SCHEMA_NAME when the Domain records a Primary Schema.
#
# CI workflows always pass --profiles-dir .github/profiles; no collision with ~/.dbt/profiles.yml.

dbt_databricks_compile:
  target: compile
  outputs:
    compile:
      type: databricks
      # Placeholders: dbt parse and docs generate open no connection, they only
      # satisfy the adapter's profile schema.
      host: offline.cloud.databricks.com
      http_path: /sql/1.0/warehouses/offline
      token: offline
      catalog: "{{ env_var('PROD_DB_NAME') }}"            # the Domain's production catalog
      schema: "{{ env_var('PROD_SCHEMA_NAME', 'default') }}"   # the Domain's Primary Schema, else the default
