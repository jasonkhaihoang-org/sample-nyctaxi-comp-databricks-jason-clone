# Domain CI Configuration — Databricks platform
#
# Installed once by the `/install-ci` skill, which copies this template and
# substitutes this Domain's coordinates. The file then belongs to the
# repository: nothing rewrites it, and your edits persist.
#
# This bundle publishes the production dbt manifest only; it runs no PR gates.

# Platform discriminator. Must be exactly "databricks" for this bundle.
VD_DOMAIN_DATA_PLATFORM: databricks

# Short slug identifying this domain (kebab-case).
VD_DOMAIN_SLUG: nyc-taxi-databricks

# Production catalog and schema. The manifest publish renders them into every
# relation name, so an Intent's `--defer` resolves to the live production relations.
# The schema is optional: delete its line when the Domain records no Primary Schema,
# and the publish uses default.
VD_DOMAIN_DATABRICKS_CATALOG: nyctaxi_prod
VD_DOMAIN_DATABRICKS_PRIMARY_SCHEMA: main
