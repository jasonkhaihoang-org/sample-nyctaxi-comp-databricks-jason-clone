apiVersion: v3.2.0
kind: DataContract
id: 45817eb7-5720-52b9-9118-9ce4bb3430d3
name: dim_trip_quality
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp-databricks
    type: custom
    schema: core
    customProperties:
      - property: platform
        value: databricks
schema:
  - name: dim_trip_quality
    properties:
      - name: trip_quality_key
        logicalType: string
        physicalType: string
