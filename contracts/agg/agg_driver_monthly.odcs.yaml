apiVersion: v3.2.0
kind: DataContract
id: 69f3e590-f350-5786-bb4b-bf7f44d99e69
name: agg_driver_monthly
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp-databricks
    type: custom
    schema: agg
    customProperties:
      - property: platform
        value: databricks
schema:
  - name: agg_driver_monthly
    properties:
      - name: month_start_date
        logicalType: date
        physicalType: date
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: driver_key
        logicalType: integer
        physicalType: bigint
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
        relationships:
          - to: dim_driver.driver_key
      - name: driver_ref
        logicalType: string
        physicalType: string
      - name: engagement_type
        logicalType: string
        physicalType: string
      - name: garage_key
        logicalType: integer
        physicalType: bigint
        relationships:
          - to: dim_garage.garage_key
      - name: home_garage_name
        logicalType: string
        physicalType: string
      - name: active_days
        logicalType: integer
        physicalType: bigint
      - name: shift_count
        logicalType: integer
        physicalType: bigint
      - name: trip_count
        logicalType: integer
        physicalType: bigint
      - name: online_hours
        logicalType: number
        physicalType: double
      - name: on_trip_hours
        logicalType: number
        physicalType: double
      - name: gross_revenue
        logicalType: number
        physicalType: double
      - name: tip_revenue
        logicalType: number
        physicalType: double
      - name: total_cost
        logicalType: number
        physicalType: double
      - name: total_margin
        logicalType: number
        physicalType: double
      - name: paid_miles
        logicalType: number
        physicalType: double
      - name: occupancy_rate
        logicalType: number
        physicalType: double
      - name: revenue_per_online_hour
        logicalType: number
        physicalType: double
      - name: trips_per_online_hour
        logicalType: number
        physicalType: double
      - name: margin_rate
        logicalType: number
        physicalType: double
