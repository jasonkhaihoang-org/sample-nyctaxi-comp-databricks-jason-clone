        logicalType: boolean
        physicalType: boolean
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: service_type_key
        logicalType: string
        physicalType: string
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
        relationships:
          - to: dim_service_type.service_type_key
