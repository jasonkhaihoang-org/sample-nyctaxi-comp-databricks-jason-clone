        logicalType: integer
        physicalType: int
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: day_name
        logicalType: string
        physicalType: string
      - name: is_weekend
        logicalType: boolean
        physicalType: boolean
      - name: is_non_working_day
        logicalType: boolean
        physicalType: boolean
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: daypart_code
        logicalType: string
        physicalType: string
