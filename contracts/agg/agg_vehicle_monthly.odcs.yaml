apiVersion: v3.2.0
kind: DataContract
id: 78fd2945-cf26-5d13-a277-14baff2d185d
name: agg_vehicle_monthly
version: 1.0.1
status: active
servers:
  - server: sample-nyctaxi-comp-databricks
    type: custom
    schema: agg
    customProperties:
      - property: platform
        value: databricks
schema:
  - name: agg_vehicle_monthly
    properties:
      - name: month_start_date
        logicalType: date
        physicalType: date
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
      - name: vehicle_key
        logicalType: integer
        physicalType: int
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
        relationships:
          - to: dim_vehicle.vehicle_key
      - name: medallion_number
        logicalType: string
        physicalType: string
      - name: make_model
        logicalType: string
        physicalType: string
      - name: fuel_type
        logicalType: string
        physicalType: string
      - name: garage_key
        logicalType: integer
        physicalType: bigint
        relationships:
          - to: dim_garage.garage_key
      - name: active_days
        logicalType: integer
        physicalType: bigint
      - name: shift_count
        logicalType: integer
        physicalType: bigint
      - name: trip_count
        logicalType: integer
        physicalType: bigint
      - name: online_hours
        logicalType: number
        physicalType: double
      - name: on_trip_hours
        logicalType: number
        physicalType: double
      - name: gross_revenue
        logicalType: number
        physicalType: double
      - name: paid_miles
        logicalType: number
        physicalType: double
      - name: down_days
        logicalType: integer
        physicalType: bigint
      - name: maintenance_cost
        logicalType: integer
        physicalType: bigint
      - name: calendar_days
        logicalType: integer
        physicalType: int
      - name: available_days
        logicalType: integer
        physicalType: bigint
      - name: availability_adjusted_activity_rate
        logicalType: number
        physicalType: double
      - name: occupancy_rate
        logicalType: number
        physicalType: double
      - name: revenue_per_online_hour
        logicalType: number
        physicalType: double
