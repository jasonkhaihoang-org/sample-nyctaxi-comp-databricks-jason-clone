name: 'nyc_taxi_analytics'
version: '2.1.0'
config-version: 2
# A literal name: the bundle job's dbt task cannot find a profile named through env_var() here.
# A Studio Intent exports DBT_PROFILE_NAME=dbt_databricks, the same name.
profile: dbt_databricks

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # --- Business rules ---------------------------------------------------
  # The reporting window the business agreed (ADR 0003). Changing it changes the
  # numbers in every revenue mart. This is NOT a sampling control.
  report_start: '2024-01-01'
  report_end: '2024-04-01'

  # Trips below this duration or above this speed are physically implausible
  # and are flagged, not deleted (ADR 0004).
  max_plausible_mph: 80
  min_plausible_seconds: 30

models:
  # The evaluator package audits the project's own structure. It is built only when
  # the quality workflow asks for it (--vars '{dbt_project_evaluator_enabled: true}').
  dbt_project_evaluator:
    +enabled: "{{ var('dbt_project_evaluator_enabled', false) }}"
  nyc_taxi_analytics:
    +persist_docs:
      relation: true
      columns: true
    # Every layer is a table: one materialisation rule for the whole project.
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
        # fct_trip is the only incremental model and carries an enforced contract; dbt
        # refuses that pair without an explicit on_schema_change.
        +on_schema_change: append_new_columns
      agg:
        +schema: agg
      finance:
        +schema: finance
      ops:
        +schema: ops

seeds:
  dbt_project_evaluator:
    +enabled: "{{ var('dbt_project_evaluator_enabled', false) }}"
  nyc_taxi_analytics:
    +schema: seeds
    +quote_columns: false
