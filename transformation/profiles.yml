# transformation/profiles.yml — the Domain's own profile, for a run outside Studio and the bundle
# job. It names the production catalog and Primary Schema; the host, warehouse and token come
# from the environment, so nothing here points at one workspace or carries a credential.
# An Intent runs with Studio's dbt_databricks profile, written outside the repository, and the
# bundle job's dbt task with the profile Databricks generates from the job's warehouse,
# catalog and schema. The CI bundle parses with its own offline profile (.github/profiles).
dbt_databricks:
  target: prod
  outputs:
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: nyctaxi_prod
      schema: main
      threads: 4
