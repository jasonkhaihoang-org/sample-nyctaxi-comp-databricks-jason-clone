# Local and Domain-seeding runs. In a Studio Intent the runtime supplies its own
# profile (DBT_PROFILE_NAME, DBT_PROFILES_DIR) and this file is not read.
# The path comes from the same variable the sandbox uses, never a literal:
# orchestration/run_*.py and docs/setup/seed_domain_duckdb.py set it.
nyc_taxi_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('VD_EPHM_DUCKDB_LOCAL_PATH') }}"
      schema: main
      threads: 8
